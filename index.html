<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>我的奶蛙 3D</title>
<style>
  :root{--u:1px;--brown:#6b3d12;--cream:#fff3d6;--line:#8a5530}
  html,body{margin:0;height:100%;background:#2b2118;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#ffe2b0}
  #stage canvas{display:block;touch-action:none}
  .abs{position:absolute}
  #hud{left:calc(var(--u)*10);top:calc(var(--u)*10);width:calc(var(--u)*350);height:calc(var(--u)*100);background:rgba(107,61,18,.84);border-radius:calc(var(--u)*22);color:#fff;pointer-events:none}
  .bar{position:absolute;left:calc(var(--u)*52);width:calc(var(--u)*120);height:calc(var(--u)*16);border-radius:calc(var(--u)*8);background:rgba(0,0,0,.22);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:calc(var(--u)*8);transition:width .3s}
  .ico{position:absolute;left:calc(var(--u)*12);font-size:calc(var(--u)*20);line-height:1}
  #lv{left:calc(var(--u)*190);top:calc(var(--u)*14);font-weight:bold;font-size:calc(var(--u)*20);color:#ffe9b0}
  #xpb{left:calc(var(--u)*190);top:calc(var(--u)*46);width:calc(var(--u)*148);height:calc(var(--u)*10);border-radius:calc(var(--u)*5);background:#ffd95a40;overflow:hidden}
  #xpb i{display:block;height:100%;background:#ff9d00}
  #coins{left:calc(var(--u)*190);top:calc(var(--u)*66);font-weight:bold;font-size:calc(var(--u)*24)}
  #mute{right:calc(var(--u)*14);top:calc(var(--u)*14);width:calc(var(--u)*48);height:calc(var(--u)*48);border-radius:50%;background:rgba(107,61,18,.84);font-size:calc(var(--u)*26);display:flex;align-items:center;justify-content:center;cursor:pointer}
  #btns{left:calc(var(--u)*30);bottom:calc(var(--u)*12);display:flex;gap:calc(var(--u)*20)}
  .btn{width:calc(var(--u)*100);height:calc(var(--u)*76);border-radius:calc(var(--u)*26);background:var(--cream);border:calc(var(--u)*4) solid var(--line);box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--brown);font-weight:bold;font-size:calc(var(--u)*17);cursor:pointer;gap:calc(var(--u)*2)}
  .btn b{font-size:calc(var(--u)*32);line-height:1}
  .btn.on{background:#ff9d2e;color:#fff}
  .btn:active{transform:scale(.94)}
  #tray{left:calc(var(--u)*10);right:calc(var(--u)*10);bottom:calc(var(--u)*100);height:calc(var(--u)*112);background:rgba(107,61,18,.92);border-radius:calc(var(--u)*26);display:none;align-items:center;justify-content:space-around}
  #tray.show{display:flex}
  .food{width:calc(var(--u)*82);height:calc(var(--u)*92);background:var(--cream);border-radius:calc(var(--u)*20);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--u)*16);font-weight:bold;color:var(--brown);cursor:grab;touch-action:none}
  .food b{font-size:calc(var(--u)*42);line-height:1.1}
  .food small{color:#d77a00;font-size:calc(var(--u)*15)}
  .food.no{opacity:.45}
  #bubble{display:none;background:#fff;border:calc(var(--u)*4) solid #e0a15a;color:var(--brown);font-weight:bold;font-size:calc(var(--u)*26);padding:calc(var(--u)*10) calc(var(--u)*22);border-radius:calc(var(--u)*30);white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none}
  #bubble:after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-14);margin-left:calc(var(--u)*-8);border:calc(var(--u)*8) solid transparent;border-top:calc(var(--u)*12) solid #e0a15a;border-bottom:0}
  #toast{display:none;left:50%;top:calc(var(--u)*130);transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;font-weight:bold;font-size:calc(var(--u)*22);padding:calc(var(--u)*12) calc(var(--u)*24);border-radius:calc(var(--u)*30);white-space:nowrap;pointer-events:none}
  .fx{position:absolute;pointer-events:none;font-size:calc(var(--u)*34);transform:translate(-50%,-50%);will-change:transform,opacity}
  #ghost{position:fixed;display:none;font-size:70px;pointer-events:none;transform:translate(-50%,-80%);z-index:9}
  #start{inset:0;background:rgba(60,30,5,.55);display:flex;flex-direction:column;align-items:center;color:#fff;cursor:pointer}
  #start h1{margin:calc(var(--u)*120) 0 0;font-size:calc(var(--u)*68);color:#ffe9b0;text-shadow:0 calc(var(--u)*4) 0 #8a5530}
  #start p{font-size:calc(var(--u)*26);margin:calc(var(--u)*14) 0 0}
  #go{position:absolute;bottom:calc(var(--u)*110);padding:calc(var(--u)*20) calc(var(--u)*70);border-radius:calc(var(--u)*60);background:#ffb02e;font-size:calc(var(--u)*36);font-weight:bold;animation:pulse 1s infinite alternate}
  #chars{right:calc(var(--u)*14);top:calc(var(--u)*72);display:flex;flex-direction:column;gap:calc(var(--u)*10)}
  .ch{width:calc(var(--u)*48);height:calc(var(--u)*48);border-radius:50%;background:rgba(107,61,18,.84);font-size:calc(var(--u)*26);display:flex;align-items:center;justify-content:center;cursor:pointer;border:calc(var(--u)*3) solid transparent;box-sizing:border-box;opacity:.75}
  .ch.on{border-color:#ffd95a;background:#ff9d2e;opacity:1}
  #hint{position:absolute;bottom:calc(var(--u)*50);font-size:calc(var(--u)*20);color:#ffd9a0}
  @keyframes pulse{to{transform:scale(1.07)}}
</style>
</head>
<body>
<div id="stage">
  <div id="hud" class="abs">
    <span class="ico" style="top:calc(var(--u)*18)">🍖</span><div class="bar" style="top:calc(var(--u)*20)"><i id="b1" style="background:#ffb02e"></i></div>
    <span class="ico" style="top:calc(var(--u)*42)">💛</span><div class="bar" style="top:calc(var(--u)*44)"><i id="b2" style="background:#ff7aa8"></i></div>
    <span class="ico" style="top:calc(var(--u)*66)">⚡</span><div class="bar" style="top:calc(var(--u)*68)"><i id="b3" style="background:#5ec8ff"></i></div>
    <div id="lv" class="abs">Lv.1</div><div id="xpb" class="abs"><i id="xp"></i></div><div id="coins" class="abs">🪙 20</div>
  </div>
  <div id="mute" class="abs">🔊</div>
  <div id="chars" class="abs"><div class="ch on" data-c="frog" title="奶蛙">🐸</div><div class="ch" data-c="egg" title="奶蛋">🥚</div></div>
  <div id="bubble" class="abs"></div>
  <div id="toast" class="abs"></div>
  <div id="tray" class="abs"></div>
  <div id="btns" class="abs">
    <div class="btn" data-b="feed"><b>🍎</b>喂食</div>
    <div class="btn" data-b="talk"><b>🎤</b>复读</div>
    <div class="btn" data-b="play"><b>🎮</b>玩耍</div>
    <div class="btn" data-b="sleep"><b>💡</b>睡觉</div>
  </div>
  <div id="start" class="abs"><h1>我的奶蛙</h1><p>3D 版 · 养一只会撒娇的奶蛙</p><div id="go">加载中…</div><div id="hint">戳头 · 搓肚子 · 喂食 · 复读 · 玩耍 · 睡觉 · 右上角切换 🐸奶蛙 / 🥚奶蛋</div></div>
</div>
<div id="ghost"></div>
<script src="assets.js"></script>
<script src="bundle.js"></script>
</body>
</html>
